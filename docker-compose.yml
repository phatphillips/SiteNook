version: "3.9"

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started
      pocketbase:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  web:
    build: ./apps/web
    environment:
      NUXT_PUBLIC_POCKETBASE_URL: http://pocketbase:8090
      NUXT_PUBLIC_APP_URL: http://localhost
    depends_on:
      - pocketbase

  scanner:
    build: ./apps/scanner
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      CONCURRENCY: ${SCANNER_CONCURRENCY:-3}
      MAX_PAGES_PER_SCAN: ${SCANNER_MAX_PAGES:-500}
      SCANNER_POLL_INTERVAL_MS: ${SCANNER_POLL_INTERVAL_MS:-10000}
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    shm_size: "2gb"

  pocketbase:
    build: ./services/pocketbase
    volumes:
      - pb_data:/pb/pb_data
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      APP_USER_EMAIL: ${APP_USER_EMAIL}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pb_data:
