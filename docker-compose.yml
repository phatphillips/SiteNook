services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    restart: unless-stopped
    # web: service_started is enough — nginx.conf uses Docker DNS + variables so
    # missing/restarting upstreams yield 502 instead of an nginx crash. Entrypoint
    # also waits for DNS. Prefer this over service_healthy (Nuxt cold start is slow).
    depends_on:
      web:
        condition: service_started
      pocketbase:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_POCKETBASE_URL: ${NUXT_PUBLIC_POCKETBASE_URL:-http://localhost}
      NUXT_PUBLIC_APP_URL: http://localhost
      NUXT_PUBLIC_APP_DOMAIN: localhost
      NUXT_POCKETBASE_URL: http://pocketbase:8090
      NUXT_PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      NUXT_PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      NUXT_PROVISION_API_KEY: ${NUXT_PROVISION_API_KEY:-}
      NUXT_PUBLIC_SUPPORT_EMAIL: ${NUXT_PUBLIC_SUPPORT_EMAIL:-contact@your-org.com}
      NUXT_PUBLIC_TENANT_ONLY: ${NUXT_PUBLIC_TENANT_ONLY:-false}
      NUXT_PUBLIC_MARKETING_SITE: ${NUXT_PUBLIC_MARKETING_SITE:-false}
      NUXT_PUBLIC_SELF_SERVICE_SIGNUP: ${NUXT_PUBLIC_SELF_SERVICE_SIGNUP:-false}
      NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NUXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NUXT_STRIPE_SECRET_KEY: ${NUXT_STRIPE_SECRET_KEY:-}
      NUXT_STRIPE_STARTER_PRICE_ID: ${NUXT_STRIPE_STARTER_PRICE_ID:-}
      NUXT_STRIPE_TEAM_PRICE_ID: ${NUXT_STRIPE_TEAM_PRICE_ID:-}
      NUXT_STRIPE_BUSINESS_PRICE_ID: ${NUXT_STRIPE_BUSINESS_PRICE_ID:-}
      NUXT_STRIPE_STANDARD_PRICE_ID: ${NUXT_STRIPE_STANDARD_PRICE_ID:-}
      NUXT_STRIPE_STARTER_ANNUAL_PRICE_ID: ${NUXT_STRIPE_STARTER_ANNUAL_PRICE_ID:-}
      NUXT_STRIPE_TEAM_ANNUAL_PRICE_ID: ${NUXT_STRIPE_TEAM_ANNUAL_PRICE_ID:-}
      NUXT_STRIPE_BUSINESS_ANNUAL_PRICE_ID: ${NUXT_STRIPE_BUSINESS_ANNUAL_PRICE_ID:-}
      NUXT_STRIPE_SELFHOST_PRICE_ID: ${NUXT_STRIPE_SELFHOST_PRICE_ID:-}
      NUXT_STRIPE_SELFHOST_ANNUAL_PRICE_ID: ${NUXT_STRIPE_SELFHOST_ANNUAL_PRICE_ID:-}
      NUXT_STRIPE_STARTER_PRICE_ID_AUD: ${NUXT_STRIPE_STARTER_PRICE_ID_AUD:-}
      NUXT_STRIPE_TEAM_PRICE_ID_AUD: ${NUXT_STRIPE_TEAM_PRICE_ID_AUD:-}
      NUXT_STRIPE_BUSINESS_PRICE_ID_AUD: ${NUXT_STRIPE_BUSINESS_PRICE_ID_AUD:-}
      NUXT_STRIPE_WEBHOOK_SECRET: ${NUXT_STRIPE_WEBHOOK_SECRET:-}
      NUXT_PUBLIC_STRIPE_DEV_BYPASS: ${NUXT_PUBLIC_STRIPE_DEV_BYPASS:-false}
      NUXT_STRIPE_DEV_BYPASS_TOKEN: ${NUXT_STRIPE_DEV_BYPASS_TOKEN:-}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NUXT_TURNSTILE_SECRET: ${NUXT_TURNSTILE_SECRET:-}
      NUXT_PUBLIC_TERMS_URL: ${NUXT_PUBLIC_TERMS_URL:-}
      NUXT_LICENCE_SIGNING_SECRET: ${NUXT_LICENCE_SIGNING_SECRET:-}
      NUXT_PREVIEW_SIGNING_SECRET: ${NUXT_PREVIEW_SIGNING_SECRET:-${PB_ADMIN_PASSWORD}}
      NUXT_LICENCE_ADMIN_KEY: ${NUXT_LICENCE_ADMIN_KEY:-}
      ANALYTICS_CREDENTIALS_ENCRYPTION_KEY: ${ANALYTICS_CREDENTIALS_ENCRYPTION_KEY:-}
      GA4_OAUTH_CLIENT_ID: ${GA4_OAUTH_CLIENT_ID:-}
      GA4_OAUTH_CLIENT_SECRET: ${GA4_OAUTH_CLIENT_SECRET:-}
      ANALYTICS_SYNC_ENABLED: ${ANALYTICS_SYNC_ENABLED:-1}
      ANALYTICS_SYNC_TICK_MS: ${ANALYTICS_SYNC_TICK_MS:-300000}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key-local-only}
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-0}
      SITENOOK_COMMERCIAL: ${SITENOOK_COMMERCIAL:-0}
    depends_on:
      pocketbase:
        condition: service_healthy
      typesense:
        condition: service_started
    healthcheck:
      # TCP accept is enough — first Nuxt HTTP responses can exceed 5–10s while compiling.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',function(){process.exit(1)})"
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 45s

  verapdf:
    profiles: ["pdf"]
    image: verapdf/rest:latest
    ports:
      - "8080:8080"
    restart: unless-stopped

  opendataloader:
    profiles: ["pdf"]
    build: ./services/opendataloader
    ports:
      - "8095:8095"
    environment:
      PORT: 8095
      ODL_MAX_BYTES: ${ODL_MAX_BYTES:-20971520}
      ODL_TIMEOUT_SEC: ${ODL_TIMEOUT_SEC:-180}
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    volumes:
      - typesense_data:/data
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key-local-only}
    command: '--data-dir /data --enable-cors'

  scanner:
    build: ./apps/scanner
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      CONCURRENCY: ${SCANNER_CONCURRENCY:-3}
      MAX_PAGES_PER_SCAN: ${SCANNER_MAX_PAGES:-500}
      SCANNER_POLL_INTERVAL_MS: ${SCANNER_POLL_INTERVAL_MS:-10000}
      SCANNER_FLUSH_EVERY_PAGES: ${SCANNER_FLUSH_EVERY_PAGES:-5}
      SCANNER_BULLMQ_ENABLED: ${SCANNER_BULLMQ_ENABLED:-0}
      BULLMQ_REDIS_URL: ${BULLMQ_REDIS_URL:-redis://redis:6379}
      SCANNER_WORKER_CONCURRENCY: ${SCANNER_WORKER_CONCURRENCY:-1}
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-60000}
      SCANNER_TIMEZONE: ${SCANNER_TIMEZONE:-UTC}
      SCANNER_CRAWL_DEBUG: ${SCANNER_CRAWL_DEBUG:-0}
      VERAPDF_URL: ${VERAPDF_URL:-http://verapdf:8080}
      OPENDATALOADER_URL: ${OPENDATALOADER_URL:-http://opendataloader:8095}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key-local-only}
      TYPESENSE_ENABLED: ${TYPESENSE_ENABLED:-0}
      SITENOOK_COMMERCIAL: ${SITENOOK_COMMERCIAL:-0}
    depends_on:
      pocketbase:
        condition: service_healthy
      typesense:
        condition: service_started
      redis:
        condition: service_started
        required: false
    restart: unless-stopped
    shm_size: "2gb"

  pocketbase:
    build: ./services/pocketbase
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      APP_USER_EMAIL: ${APP_USER_EMAIL}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      DEFAULT_ORG_SUBDOMAIN: ${DEFAULT_ORG_SUBDOMAIN:-default}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-Default Organization}
      APP_NAME: ${APP_NAME:-SiteNook}
      APP_DASHBOARD_URL: ${APP_DASHBOARD_URL:-http://localhost}
      APP_PUBLIC_DOMAIN: ${NUXT_PUBLIC_APP_DOMAIN:-localhost}
      SITENOOK_COMMERCIAL: ${SITENOOK_COMMERCIAL:-0}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  pocketbase-test:
    profiles: ["test"]
    build: ./services/pocketbase
    environment:
      PB_ADMIN_EMAIL: test-admin@sitenook.test
      PB_ADMIN_PASSWORD: test-password-123
      APP_USER_EMAIL: test-user@sitenook.test
      APP_USER_PASSWORD: test-user-password-123
    ports:
      - "8091:8090"
    volumes:
      - ./tests/fixtures/pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  litestream:
    image: litestream/litestream:0.3.13
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      LITESTREAM_S3_BUCKET: ${LITESTREAM_S3_BUCKET:-}
      LITESTREAM_S3_ENDPOINT: ${LITESTREAM_S3_ENDPOINT:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_S3_REGION: ${LITESTREAM_S3_REGION:-us-east-1}
    volumes:
      - pb_data:/pb/pb_data
      - ./services/litestream/litestream.yml:/etc/litestream.yml:ro
    command: ["replicate", "-config", "/etc/litestream.yml"]

volumes:
  pb_data:
  redis_data:
  typesense_data:
