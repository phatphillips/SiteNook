name: publish-ghcr

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install and test web
        working-directory: apps/web
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm test
          pnpm run lint
          pnpm run typecheck

      - name: Install and test scanner
        working-directory: apps/scanner
        run: |
          npm install
          npm test

  compose-config:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Validate community compose
        run: docker compose -f deploy/community/docker-compose.yml config

  publish:
    runs-on: ubuntu-latest
    needs: [test, compose-config]
    strategy:
      matrix:
        include:
          - context: apps/web
            image: sitenook-web
            target: production
          - context: apps/scanner
            image: sitenook-scanner
            target: production
          - context: services/pocketbase
            image: sitenook-pocketbase
            target: ''
          - context: nginx
            image: sitenook-nginx
            target: ''
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push (production stage)
        if: matrix.target != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.target }}

      - name: Build and push (default stage)
        if: matrix.target == ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
